---
# K3s 单Server部署（京东云控制面）：公网SAN + wireguard-native + 定时快照
- name: Deploy K3s server
  hosts: k3s_server
  become: true
  tasks:
    - name: Verify pinned K3s version exists on CN mirror (+ is rewritten to - on mirror)
      ansible.builtin.uri:
        url: "https://rancher-mirror.rancher.cn/k3s/{{ k3s_version | regex_replace('\\+', '-') }}/k3s"
        method: HEAD
        status_code: [200, 302]
      register: version_check
      ignore_errors: true

    - name: Fail fast if pinned version unavailable
      ansible.builtin.fail:
        msg: "K3s {{ k3s_version }} not found on mirror, adjust k3s_version in inventory"
      when: version_check is failed

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | \
        INSTALL_K3S_MIRROR=cn \
        INSTALL_K3S_VERSION={{ k3s_version }} \
        sh -s - server \
          --node-name {{ node_name }} \
          --node-ip {{ node_external_ip }} \
          --node-external-ip {{ node_external_ip }} \
          --tls-san {{ node_external_ip }} \
          --flannel-backend=wireguard-native \
          --flannel-external-ip \
          --flannel-iface {{ flannel_iface | default('eth0') }} \
          --disable-network-policy \
          --disable traefik \
          --node-taint node-role.kubernetes.io/control-plane=true:NoSchedule \
          --write-kubeconfig-mode 600
      args:
        creates: /usr/local/bin/k3s
        executable: /bin/bash

    # 注意：SQLite 后端不支持 --etcd-snapshot（仅 etcd 生效），改用 sqlite3 .backup 定时备份
    - name: Install sqlite3, curl and jq for backup/offsite push
      ansible.builtin.apt:
        name:
          - sqlite3
          - curl
          - jq
        state: present

    # 异地容灾：快照推 Cloudflare R2 独立桶 devops-backup/k3s-state/（REST API 方案）
    # 凭据文件 secrets/r2-backup-cred（gitignore 不入库），node 上部署为 /root/.r2-backup-cred
    - name: Deploy R2 credential for offsite backup
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../secrets/r2-backup-cred"
        dest: /root/.r2-backup-cred
        mode: "0600"
      no_log: true

    - name: Install SQLite backup script (local 10 + R2 offsite 30d, every 6h)
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
        content: "{{ item.content }}"
      loop:
        - dest: /usr/local/bin/k3s-sqlite-backup.sh
          mode: "0755"
          content: |
            #!/bin/bash
            set -e
            DB=/var/lib/rancher/k3s/server/db/state.db
            DIR=/var/lib/rancher/k3s/server/db/snapshots
            KEEP=10
            # R2_* 凭据 + FEISHU_WEBHOOK_URL（备份失败直发飞书）
            source /root/.r2-backup-cred
            feishu() {
              [ -n "${FEISHU_WEBHOOK_URL:-}" ] || return 0
              curl -s -m 10 -X POST "$FEISHU_WEBHOOK_URL" -H "Content-Type: application/json" \
                -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"[K3s备份告警] 京东云 SQLite 备份失败: $1\n排查: ssh 京东云 'journalctl -u k3s-sqlite-backup -n 50'\"}}" >/dev/null 2>&1 || true
            }
            STAGE=local-backup
            trap 'rc=$?; if [ "$rc" -ne 0 ]; then feishu "阶段=${STAGE}（exit=${rc}）"; fi' EXIT
            sqlite3 "$DB" ".backup $DIR/state-$(date +%Y%m%d-%H%M%S).db"
            ls -1t $DIR/state-*.db | tail -n +$((KEEP+1)) | xargs -r rm -f
            # 异地推送（Cloudflare R2 REST API，独立桶 devops-backup）。失败不阻断本地备份，仅告警，下次 timer 重试
            API="https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects"
            AUTH="Authorization: Bearer ${R2_BEARER_TOKEN}"
            LATEST=$(ls -1t $DIR/state-*.db | head -1)
            if curl -sf -X PUT -H "$AUTH" --data-binary @"$LATEST" "$API/k3s-state/$(basename "$LATEST")" >/tmp/r2-put.json 2>/tmp/r2-err.log; then
              # 保留 30 天：按文件名日期（state-YYYYMMDD-HHMMSS.db）清理过期对象
              STAGE=offsite-cleanup
              CUTOFF=$(date -d '30 days ago' +%Y%m%d)
              curl -sf -H "$AUTH" "$API?prefix=k3s-state/&per_page=100" \
                | jq -r '.result[]?.key' \
                | while read -r k; do
                    d=$(echo "$k" | grep -o '[0-9]\{8\}' | head -1)
                    if [ -n "$d" ] && [ "$d" -lt "$CUTOFF" ]; then
                      curl -sf -X DELETE -H "$AUTH" "$API/$k" && echo "$(date '+%F %T') expired deleted: $k" >> /var/log/k3s-sqlite-backup.log
                    fi
                  done
              echo "$(date '+%F %T') offsite OK: $(basename "$LATEST")" >> /var/log/k3s-sqlite-backup.log
            else
              echo "$(date '+%F %T') offsite FAILED: $(cat /tmp/r2-err.log)" >> /var/log/k3s-sqlite-backup.log
              feishu "R2 异地推送失败: $(head -c 200 /tmp/r2-err.log)"
            fi
        - dest: /etc/systemd/system/k3s-sqlite-backup.service
          mode: "0644"
          content: |
            [Unit]
            Description=K3s SQLite state.db backup

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/k3s-sqlite-backup.sh
        - dest: /etc/systemd/system/k3s-sqlite-backup.timer
          mode: "0644"
          content: |
            [Unit]
            Description=K3s SQLite backup every 6h

            [Timer]
            OnCalendar=*-*-* 0/6:00:00
            Persistent=true

            [Install]
            WantedBy=timers.target

    - name: Enable SQLite backup timer
      ansible.builtin.systemd:
        name: k3s-sqlite-backup.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Wait for API server 6443
      ansible.builtin.wait_for:
        port: 6443
        timeout: 180

    - name: Wait for node Ready
      ansible.builtin.command: kubectl get node {{ node_name }}
      register: node_status
      until: "' Ready' in node_status.stdout"
      retries: 30
      delay: 10
      changed_when: false

    - name: Read agent join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

    - name: Save token locally for agents playbook (secrets/ is gitignored)
      ansible.builtin.copy:
        content: "{{ node_token_raw.content | b64decode }}"
        dest: "{{ playbook_dir }}/../../secrets/k3s-node-token"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Fetch kubeconfig to local (rewrite server address to public IP)
      ansible.builtin.shell: |
        sed 's/127.0.0.1/{{ node_external_ip }}/' /etc/rancher/k3s/k3s.yaml > /tmp/k3s-public.yaml
      changed_when: true

    - name: Copy public kubeconfig to local machine
      ansible.builtin.fetch:
        src: /tmp/k3s-public.yaml
        dest: "~/.kube/devops-k3s-config"
        flat: true
      become: false
