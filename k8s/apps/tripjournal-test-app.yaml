# tripjournal 测试环境（阶段1 同集群 tripjournal-test namespace；阶段2 迁独立测试集群）
# 发布流：Git 变更自动同步（test 永远追踪 main 最新，含镜像内容不变时的清单变更）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tripjournal-test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitee.com/jamesfeng_2009/devops.git
    targetRevision: main
    path: k8s/tripjournal/overlays/test
  destination:
    server: https://172.16.0.3:7443 # k3s-test 独立测试集群（京东云宿主内网IP，公网IP为1:1 NAT不可hairpin，阶段2）
    namespace: tripjournal-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
