# intelligent-test 海外版（eu）ArgoCD Application（源：Gitee jamesfeng_2009/intelligentTest 镜像仓）
# 链路：GitHub Actions 构建 → ACR 推镜像 → CI 改 tag 双推 → Gitee(主源) → ArgoCD 自动同步
# 前置（已完成）：ArgoCD 仓库凭证 gitee-intelligenttest（sealed-gitee-intelligenttest.yaml）
# 目标：阿里云法兰克福节点（region=eu），NodePort 30083 直连访问
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intelligent-test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitee.com/jamesfeng_2009/intelligentTest.git
    targetRevision: main
    path: k8s/overlays/eu
  destination:
    server: https://kubernetes.default.svc
    namespace: intelligent-test
  syncPolicy:
    # prod 发布受控：CI bump base 后只标 OutOfSync，验收 test 后在 ArgoCD UI 手动 Sync（回滚=Sync 历史版本）
    automated: null
    syncOptions:
      - CreateNamespace=true # namespace 定义在 overlay 清单中，GitOps 自包含
