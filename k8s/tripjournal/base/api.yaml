# trip-ledger API（Hono 后端，镜像已从宿主机 Docker 导入本节点 containerd）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-ledger-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-ledger-api
  template:
    metadata:
      labels:
        app: trip-ledger-api
    spec:
      # 启动顺序依赖：PG 重建期间 api 迁移会 ECONNREFUSED 退出 → CrashLoop + Gatus 误报。
      # 等 PG 就绪后再启动主容器（镜像 IfNotPresent，节点上已有，零拉取成本）
      initContainers:
        - name: wait-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres.tripjournal.svc.cluster.local -p 5432 -t 3; do echo 'waiting for postgres'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: api
          # 镜像来自本节点导入（imagePullPolicy 必须显式 IfNotPresent，latest 默认会 Always）
          image: docker.io/library/server-app:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: tripjournal-secrets
          # 安全加固：镜像内置 node 用户(uid 1000)，应用监听 3000 非特权端口
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trip-ledger-api
spec:
  selector:
    app: trip-ledger-api
  ports:
    - port: 3000
      targetPort: 3000
