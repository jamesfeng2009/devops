# TripJournal 官网（Astro SSG 静态产物，宿主机目录只读挂载）
# 安全加固：nginx 用户(uid 101)运行 + 只读根文件系统；listen 80 改 8080（非特权端口），
# Service targetPort 同步 8080（Ingress 仍走 Service 80 不变）；缓存与 pid 目录用 emptyDir
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-site-conf
data:
  default.conf: |
    server {
        listen       8080;
        listen  [::]:8080;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripjournal-web
spec:
  replicas: 2
  # 零中断滚动：与 api.yaml 同策略，新副本 Ready 并稳定 30s 后才杀旧副本
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tripjournal-web
  template:
    metadata:
      labels:
        app: tripjournal-web
    spec:
      containers:
        - name: web
          # 版本 pin：与原 nginx:alpine 同一构建（digest 1b595815db669 已在节点预拉验证）
          image: nginx:1.31.5-alpine
          imagePullPolicy: IfNotPresent
          # 安全加固：nginx 官方镜像内置 nginx 用户(101)，端口 8080 非特权
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: site
          hostPath:
            path: /var/www/tripjournal-site
            type: Directory
        - name: conf
          configMap:
            name: nginx-site-conf
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tripjournal-web
spec:
  selector:
    app: tripjournal-web
  ports:
    - port: 80
      targetPort: 8080
