# PostgreSQL 业务数据每日备份（P0：local-path PVC 无快照能力，节点丢失=数据归零）
# 链路：pg_dump -Fc（集群内 postgres Service）→ Cloudflare REST API PUT 到独立桶 devops-backup/pg/ → 保留 30 天
# 隔离：备份使用独立桶 devops-backup（与爬虫桶 novelcomics 完全分开），30 天过期由脚本按文件名日期清理
# 凭据：R2_ACCOUNT_ID / R2_BEARER_TOKEN / R2_BUCKET 来自 Secret backup-r2（明文源 secrets/backup-r2-secret.yaml，gitignore）
#       Bearer Token 复用 novelComics 项目的 R2 API Token（REST API 方案，无需 S3 密钥/rclone）
# DB 凭据：复用 tripjournal-secrets（POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB）
# 时区：CronJob 按 UTC 调度，21:00 UTC = 次日 05:00 北京时间（低峰窗口）
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 21 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            cloud: tencent
          containers:
            - name: backup
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: tripjournal-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tripjournal-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: tripjournal-secrets
                      key: POSTGRES_DB
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-r2
                      key: R2_ACCOUNT_ID
                - name: R2_BEARER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backup-r2
                      key: R2_BEARER_TOKEN
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-r2
                      key: R2_BUCKET
                - name: FEISHU_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: feishu-alerts
                      key: feishu_webhook_url
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  # 失败直发飞书（Secret feishu-alerts，sealed 入 Git）：set -e 下任一步骤失败触发 EXIT trap
                  trap 'rc=$?; if [ "$rc" -ne 0 ]; then curl -s -m 10 -X POST "$FEISHU_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"[PG备份告警] trip_ledger 每日备份失败（exit=$rc），排查: kubectl logs job/postgres-backup -n tripjournal\"}}" >/dev/null 2>&1 || true; fi' EXIT
                  export R2_API="https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects"
                  AUTH="Authorization: Bearer ${R2_BEARER_TOKEN}"
                  # CN 网络：apk 走 USTC 镜像源安装 curl/jq
                  sed -i 's/dl-cdn.alpinelinux.org/mirrors.ustc.edu.cn/' /etc/apk/repositories
                  apk add --no-cache --quiet curl jq
                  STAMP=$(date +%Y%m%d-%H%M)
                  DUMP=/tmp/trip_ledger-${STAMP}.dump
                  KEY="pg/trip_ledger-${STAMP}.dump"
                  echo "[backup] pg_dump ${POSTGRES_DB} -> ${DUMP}"
                  pg_dump -h postgres.tripjournal.svc.cluster.local -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Fc -f "${DUMP}"
                  ls -lh "${DUMP}"
                  echo "[backup] upload -> R2 devops-backup/${KEY}"
                  RESP=$(curl -sf -X PUT -H "$AUTH" --data-binary @"${DUMP}" "${R2_API}/${KEY}")
                  echo "${RESP}" | jq -r '"[backup] upload result: \(.result.key) \(.result.size) bytes"'
                  # 保留 30 天：按文件名日期（pg/trip_ledger-YYYYMMDD-HHMM.dump）清理过期对象
                  # 注意：alpine busybox date 不支持 -d '30 days ago'，用 epoch 运算
                  CUTOFF=$(date -u -d @$(($(date +%s) - 2592000)) +%Y%m%d)
                  curl -sf -H "$AUTH" "${R2_API}?prefix=pg/&per_page=100" \
                    | jq -r '.result[]?.key' \
                    | while read -r k; do
                        d=$(echo "$k" | grep -o '[0-9]\{8\}' | head -1)
                        if [ -n "$d" ] && [ "$d" -lt "$CUTOFF" ]; then
                          curl -sf -X DELETE -H "$AUTH" "${R2_API}/${k}" && echo "[backup] expired deleted: $k"
                        fi
                      done
                  echo "[backup] done"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
