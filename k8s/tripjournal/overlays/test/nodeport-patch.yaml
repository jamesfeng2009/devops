# ClusterIP → NodePort：测试环境直连入口（生产走 Ingress，test 不配 Ingress/TLS）
apiVersion: v1
kind: Service
metadata:
  name: tripjournal-web
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: trip-ledger-api
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30091
