# 测试环境资源保护（阶段2 起跑在 k3s-test 独立集群，不再挤占生产；保留 quota 防失控）
# 注意：requests.memory 须 ≥ 全部 Pod 请求之和 + 滚动期 maxSurge 峰值，否则滚动永久卡死
apiVersion: v1
kind: ResourceQuota
metadata:
  name: test-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "3"
    limits.memory: 4Gi
    pods: "16"
    persistentvolumeclaims: "4"
