# test PG：调度锁腾讯 + 置空 securityContext（与生产 cn/eu 一致：官方镜像 entrypoint 需 root 起，
# gosu 降权跑 postgres uid 70；数据卷 owner 已手动 chown。runAsNonRoot 对 PG 官方镜像不可行）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  template:
    spec:
      nodeSelector:
        cloud: tencent
      securityContext: null
      containers:
        - name: postgres
          securityContext: null
