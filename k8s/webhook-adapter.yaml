# Gitee→ArgoCD Webhook 协议适配器
# 背景：ArgoCD 原生 webhook 仅支持 GitHub/GitLab/Bitbucket/AzureDevOps/Gogs，不支持 Gitee；
#       且 Gitee 开放 API 创建的 webhook 无法配置密码/签名（投递头全空）
# 方案：密钥编入 URL 路径作能力令牌 /gitee/<GITEE_SECRET>（Gitee hook 的 url 字段）
#       收到 push → 转 GitHub push 格式（X-Hub-Signature-256 HMAC 重签）→ 转发 argocd-server
# 入口：NodePort 30082（腾讯云防火墙需放行 TCP 30082）；密钥复用 argocd-secret，不入 Git
# 注意：ArgoCD 已启用 TLS（helm values server.insecure=false），集群内转发走 https + 跳过自签校验
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-adapter-script
  namespace: argocd
data:
  adapter.py: |
    import hmac, hashlib, json, os, ssl, uuid
    from urllib import request as ureq
    from http.server import BaseHTTPRequestHandler, HTTPServer

    GITEE_SECRET = os.environ["WEBHOOK_SECRET"].encode()
    GH_SECRET = os.environ["ARGOCD_GITHUB_SECRET"].encode()
    ARGOCD_URL = os.environ.get("ARGOCD_URL", "https://argocd-server.argocd.svc/api/webhook")
    # 集群内 argocd-server 为自签证书（argocd-secret/argocd-server-tls），仅跳过内部校验
    SSL_CTX = ssl._create_unverified_context() if ARGOCD_URL.startswith("https") else None

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print(self.log_date_time_string(), fmt % args, flush=True)

        def do_POST(self):
            parts = self.path.strip("/").split("/")
            path_ok = len(parts) == 2 and parts[0] == "gitee" and hmac.compare_digest(parts[1].encode(), GITEE_SECRET)
            if not path_ok:
                print(f"reject: bad path ({self.path.split('?')[0]})", flush=True)
                self.send_response(404); self.end_headers(); return
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length)
            token = self.headers.get("X-Gitee-Token", "")
            if token and not hmac.compare_digest(token.encode(), GITEE_SECRET):
                print(f"reject: header token mismatch (got {token[:4]}/len{len(token)})", flush=True)
                self.send_response(401); self.end_headers(); return
            event = (self.headers.get("X-Gitee-Event") or "").lower()
            # Gitee 实际发送 "Push Hook"（大小写混合带空格），按包含 push 兼容匹配
            if "push" not in event:
                print(f"ignore event: {self.headers.get('X-Gitee-Event')!r}", flush=True)
                self.send_response(200); self.end_headers(); return
            try:
                p = json.loads(body)
                repo = p.get("repository") or {}
                html = repo.get("html_url") or ""
                clone = repo.get("git_http_url") or (html + ".git" if html else "")
                gh = json.dumps({
                    "zen": "gitee-relay", "event": "push",
                    "repository": {
                        "id": repo.get("id"), "name": repo.get("name"),
                        "full_name": repo.get("full_name") or "",
                        "html_url": html, "clone_url": clone, "git_url": clone,
                        "ssh_url": repo.get("git_ssh_url") or "",
                    },
                }).encode()
            except Exception as e:
                print("bad payload:", e, flush=True)
                self.send_response(400); self.end_headers(); return
            sig = "sha256=" + hmac.new(GH_SECRET, gh, hashlib.sha256).hexdigest()
            req = ureq.Request(ARGOCD_URL, data=gh, method="POST", headers={
                "Content-Type": "application/json",
                "X-GitHub-Event": "push",
                "X-GitHub-Delivery": str(uuid.uuid4()),
                "X-Hub-Signature-256": sig,
            })
            try:
                with ureq.urlopen(req, timeout=10, context=SSL_CTX) as resp:
                    print(f"relay {repo.get('full_name')} -> argocd: {resp.status}", flush=True)
            except Exception as e:
                print("relay failed:", e, flush=True)
            self.send_response(200); self.end_headers()

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-adapter
  namespace: argocd
  labels:
    app: webhook-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-adapter
  template:
    metadata:
      labels:
        app: webhook-adapter
    spec:
      nodeSelector:
        cloud: tencent
      containers:
        - name: adapter
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/adapter.py"]
          ports:
            - containerPort: 8080
          env:
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: webhook.gitee.secret
            - name: ARGOCD_GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: argocd-secret
                  key: webhook.github.secret
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: webhook-adapter-script
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-adapter
  namespace: argocd
spec:
  type: NodePort
  selector:
    app: webhook-adapter
  ports:
    - port: 8080
      nodePort: 30082
      protocol: TCP
